# 部署拓扑（spec 1 十八次修订）：MySQL / MinIO 为外部已 provisioning 设施
# （库表与 bucket 提前创建），compose 仅编排 backend + frontend。
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: ${ENV_FILE:-.env}
    extra_hosts:
      # 容器内经 host.docker.internal 访问宿主机/外部设施（Linux 经 host-gateway 同样可用）
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8900}:8900"
    shm_size: 2gb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3200}:80"
    depends_on:
      - backend
    restart: unless-stopped
